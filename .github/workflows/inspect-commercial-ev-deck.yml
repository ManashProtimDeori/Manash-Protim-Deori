name: Inspect Commercial EV Deck

on:
  push:
    branches: [main]
    paths:
      - "scripts/inspect-commercial-ev-deck.py"
      - ".github/workflows/inspect-commercial-ev-deck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx
      - run: python scripts/inspect-commercial-ev-deck.py
