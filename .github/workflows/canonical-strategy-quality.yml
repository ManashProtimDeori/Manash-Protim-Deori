name: Canonical Strategy Quality

on:
  pull_request:
    paths:
      - 'src/pages/CanonicalStrategyLabPage.tsx'
      - 'src/data/canonicalStrategyDeck.ts'
      - 'src/data/canonicalMarketingDecision.ts'
      - 'src/lib/canonicalStrategyModel.ts'
      - 'src/lib/canonicalMarketingModel.ts'
      - 'src/components/canonical/CanonicalDecisionVisuals.tsx'
      - 'src/index.css'
      - 'tests/canonical-strategy.ts'
      - 'tests/canonical-marketing-decision.ts'
      - 'tsconfig.canonical.json'
      - 'package.json'
      - '.github/workflows/canonical-strategy-quality.yml'
  workflow_dispatch:

jobs:
  canonical-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check Canonical strategy
        run: npm run lint:canonical
      - name: Test Canonical strategy model
        run: npm run test:canonical
      - name: Test Canonical marketing decision model
        run: npm run test:canonical-marketing
