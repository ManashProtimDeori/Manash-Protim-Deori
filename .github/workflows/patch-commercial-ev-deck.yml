name: Patch Commercial EV Deck

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-commercial-ev-deck.py"
      - ".github/workflows/patch-commercial-ev-deck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: pip install python-pptx

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Patch PPTX and regenerate PDF
        run: python scripts/patch-commercial-ev-deck.py

      - name: Commit corrected deck assets
        run: |
          if git diff --quiet -- src/generated/commercial-ev-assets; then
            echo "No generated asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/generated/commercial-ev-assets/Manash-Protim-Deori-Commercial-EV-Growth-Advisory-Case.pptx.01.b64             src/generated/commercial-ev-assets/Manash-Protim-Deori-Commercial-EV-Growth-Advisory-Case.pdf.01.b64
          git commit -m "Fix Commercial EV deck text layout and source labels"
          git push
