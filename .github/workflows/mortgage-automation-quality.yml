name: Mortgage Automation Quality

on:
  pull_request:
    paths:
      - 'src/lib/mortgageAutomation.ts'
      - 'src/components/tools/mortgage/**'
      - 'src/data/tools.ts'
      - 'src/pages/ToolsPage.tsx'
      - 'src/pages/ToolDetailPage.tsx'
      - 'src/context/DataContext.tsx'
      - 'tests/mortgage-automation.ts'
      - 'tsconfig.mortgage.json'
      - 'package.json'
      - '.github/workflows/mortgage-automation-quality.yml'
  workflow_dispatch:

jobs:
  mortgage-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check mortgage automation suite
        run: npm run lint:mortgage
      - name: Test mortgage automation engine and integration
        run: npm run test:mortgage
      - name: Build full portfolio
        run: npm run build
